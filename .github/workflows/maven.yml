name: CI/CD Pipeline

on:
  push:
    branches:
      - BUILD  # Chạy khi có code được merge vào BUILD

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build project với Maven
        run: mvn clean package

      - name: Chạy test
        run: mvn test

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Chỉ chạy deploy nếu build thành công

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cấu hình SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 14.224.135.196 >> ~/.ssh/known_hosts

      - name: Kiểm tra lại Maven build
        run: mvn clean package -X

      - name: Copy JAR lên server
        run: |
          scp -i ~/.ssh/id_rsa $(find /home/runner/work/ -name "hrm-service-cms-0.0.1-SNAPSHOT.jar") root@14.224.135.196:/root/HRM/cms/

      - name: Restart ứng dụng trên server
        run: |
          ssh -i ~/.ssh/id_rsa root@14.224.135.196 "
            PID=\$(sudo lsof -t -i:2308);
            if [ ! -z \"\$PID\" ]; then
              sudo kill -9 \$PID;
              echo \"Đã dừng process có PID: \$PID\";
            else
              echo \"Không tìm thấy process nào chạy trên port 2308\";
            fi;

            echo \"Chạy lại ứng dụng...\";
            nohup java -Dfile.encoding=UTF-8 -jar /root/HRM/cms/hrm-service-cms-0.0.1-SNAPSHOT.jar > /root/HRM/cms/nohup.out 2>&1 & sleep 5;
          "

